# MSPM0G3507 target config for OpenOCD
# Cortex-M0+ based, non-standard debug AP layout

set _CHIPNAME mspm0g3507
set _CPUTAPID 0x0bc11477

swj_newdap $_CHIPNAME cpu -irlen 4 -expected-id $_CPUTAPID
dap create $_CHIPNAME.dap -chain-position $_CHIPNAME.cpu

target create $_CHIPNAME.cpu cortex_m -dap $_CHIPNAME.dap

# MSPM0G3507: 128KB Flash at 0x00000000
flash bank $_CHIPNAME.flash mspm0 0x00000000 0x00020000 0 0 $_CHIPNAME.cpu

$_CHIPNAME.cpu configure -work-area-phys 0x20200000 -work-area-size 0x8000
