# OpenOCD配置文件 - MSPM0G3507 + DAPlink
# 用于调试和烧录

# 接口配置 - DAPlink
source [find interface/cmsis-dap.cfg]
transport select swd

# 降低SWD时钟，MSPM0写Flash需要低速
adapter speed 100

# 复位配置
reset_config srst_only

# 目标芯片配置
source [find target/mspm0.cfg]

# Flash编程
flash bank $_CHIPNAME.flash mspm0 0x00000000 0x00040000 0 0 $_CHIPNAME.cpu

# 初始化
init
targets
reset halt
