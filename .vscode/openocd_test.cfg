# OpenOCD test - just try to connect to MSPM0 via DAPlink
source [find interface/cmsis-dap.cfg]
transport select swd
adapter speed 100

# Try to connect with basic DAP config
dap create mspm0.dap -chain-position 0
target create mspm0.cpu cortex_m -dap mspm0.dap -ap-num 0

init
targets
reset halt
mspm0.cpu mass_erase 0
exit
