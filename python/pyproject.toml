[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[project]
name = "m6link"
version = "0.1.0"
description = "Single-owner host link for the MSPM03507CAR M6 firmware"
requires-python = ">=3.11"
dependencies = ["pyserial>=3.5"]

[project.scripts]
m6-tune = "m6link.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/m6link"]

[tool.hatch.build.targets.wheel.force-include]
"../Tests/vectors/m6_v2_wire_v1.json" = "m6link/data/m6_v2_wire_v1.json"
"../Tests/vectors/m6_v2_wire.schema.json" = "m6link/data/m6_v2_wire.schema.json"
"../Tests/vectors/m6_zdt_stepper_ext_v1.json" = "m6link/data/m6_zdt_stepper_ext_v1.json"
"../Tests/vectors/m6_zdt_stepper_ext.schema.json" = "m6link/data/m6_zdt_stepper_ext.schema.json"
"../Tests/vectors/m6_h_mission_ext_v1.json" = "m6link/data/m6_h_mission_ext_v1.json"
"../Tests/vectors/m6_lever_calibration_ext_v1.json" = "m6link/data/m6_lever_calibration_ext_v1.json"
"../Tests/vectors/m6_h3_tune_ext_v1.json" = "m6link/data/m6_h3_tune_ext_v1.json"
"../Tests/vectors/m6_h3_ki_ext_v1.json" = "m6link/data/m6_h3_ki_ext_v1.json"
"../Tests/vectors/m6_h3_maneuver_ext_v1.json" = "m6link/data/m6_h3_maneuver_ext_v1.json"
"src/m6link/web/dashboard.html" = "m6link/web/dashboard.html"
"src/m6link/web/dashboard.css" = "m6link/web/dashboard.css"
"src/m6link/web/dashboard.js" = "m6link/web/dashboard.js"
"src/m6link/web/h3_pid_scope.html" = "m6link/web/h3_pid_scope.html"
"src/m6link/web/h3_pid_scope.css" = "m6link/web/h3_pid_scope.css"
"src/m6link/web/h3_pid_scope.js" = "m6link/web/h3_pid_scope.js"

[tool.pytest.ini_options]
testpaths = ["../Tests"]
pythonpath = ["src"]
